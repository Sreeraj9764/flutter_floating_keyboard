name: flutter_floating_keyboard
description: A draggable floating mini keyboard that replaces the system keyboard via TextInputControl. Works with all Flutter text widgets without modification.
version: 0.4.0
homepage: https://github.com/Sreeraj9764/flutter_floating_keyboard
repository: https://github.com/Sreeraj9764/flutter_floating_keyboard
issue_tracker: https://github.com/Sreeraj9764/flutter_floating_keyboard/issues

topics:
  - keyboard
  - tablet
  - text-input
  - floating-keyboard
  - custom-keyboard

screenshots:
  - description: 'Floating keyboard on iPad'
    path: screenshots/ipad-keyboad-center.png
  - description: 'Floating keyboard on iPhone'
    path: screenshots/iphone-keyboard-center.png
  - description: 'Dark theme custom config'
    path: screenshots/iphone-dakmode.png
  - description: 'Landscape mode'
    path: screenshots/iphone-lanscape.png

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  melos: ^7.7.0

melos:
  useRootAsPackage: true
  command:
    version:
      linkToCommits: true
      workspaceChangelog: false

flutter:
